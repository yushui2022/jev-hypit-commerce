name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python3 commerce.py examples/catalog.json --prepare-only --output output/request.json
      - run: python3 render.py prepare examples/storyboard.json --output output/ci
      - run: python3 productions/hd-fast/export.py --check-assets
