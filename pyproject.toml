[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-creator-network"
version = "0.4.0"
description = "Product-to-creator retrieval, auditable decisions, and Hypit production"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
semantic = ["qdrant-client>=1.14,<2", "fastembed>=0.6,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
creator-network = "creator_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
